# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# Path A: azd deploys an image you built and pushed yourself (as deploy.sh does).
# Generated by `azd ai agent init --image ... --project-id ...`, then edited to match deploy.sh.
# Per release: push a new tag, update `image:` below, run `azd deploy bal-demo-agent`.
# Values in ${...} come from the gitignored .azure/<env>/.env (`azd env set`), so no settings live here.

infra:
    provider: microsoft.foundry
name: bal-demo-agent
services:
    bal-demo-agent:
        host: azure.ai.agent
        kind: hosted
        name: bal-demo-agent
        description: Ballerina HR agent (pre-built image)
        project: .
        language: docker
        uses:
            - ballerina-demo
        # Pre-built image: azd doesn't build, pull or push it; it only puts it in the new agent version.
        image: acrdasunsdemo.azurecr.io/bal-demo-agent:azd-a1
        docker:
            imagePassthrough: true
        protocols:
            - protocol: invocations
              version: 2.0.0
        container:
            resources:
                cpu: "1"
                memory: 2Gi
        sessionConfiguration:
            idleTimeoutSeconds: 300
        env:
            AZURE_OPENAI_ENDPOINT: ${HR_AGENT_MODEL_ENDPOINT}
            MODEL_DEPLOYMENT_NAME: ${HR_AGENT_MODEL_DEPLOYMENT}
    # The existing project: azd connects to it and never provisions one.
    ballerina-demo:
        host: azure.ai.project
        endpoint: https://foundry-dasuns-demo.services.ai.azure.com/api/projects/ballerina-demo
