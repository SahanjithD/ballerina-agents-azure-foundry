# OpenTelemetry Collector Builder manifest: a slim collector with only what the agent needs
# (the full contrib build is ~420 MB).
dist:
  name: otelcol
  description: HR agent collector (OTLP in, Azure Monitor out)
  output_path: /build

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.164.0
processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.164.0
exporters:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/azuremonitorexporter v0.164.1
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.164.0
